</style></head><body><header><div class="brand">NM <span>GROUP</span></div><a class="back" href="/">← NMVIA</a></header><main class="wrap"><h1 class="title" id="pageTitle">Tüm Reklamlar</h1><p class="desc" id="pageDesc">Güncel reklamların tamamı</p><div id="content" class="feed"></div></main><script>
const U='https://cssihpvzipfpeckebvot.supabase.co',K='sb_publishable_F9fCK58YWRwEP3Unmy4BLA_fbZs3Ufj',T=U+'/rest/v1/nm_advertisements';
const H={apikey:K,Authorization:'Bearer '+K}; const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img=a=>a.image_url||U+'/storage/v1/object/public/nm-ads/'+String(a.image_path||'').split('/').map(encodeURIComponent).join('/');
const wa=a=>'https://wa.me/'+String(a.whatsapp_number||'905526648776').replace(/\D/g,'')+'?text='+encodeURIComponent((a.whatsapp_message||'Bu ilan hakkında daha detaylı bilgi verebilir misiniz?')+'\n\n📷 İlan görseli: '+img(a));
async function ads(){const now=new Date().toISOString(),q=T+'?select=*&active=eq.true&starts_at=lte.'+encodeURIComponent(now)+'&expires_at=gt.'+encodeURIComponent(now)+'&order=sort_order.asc,created_at.desc';const r=await fetch(q,{headers:H});if(!r.ok)throw Error('ads '+r.status);return await r.json()}
function detail(a){document.title=(a.seo_title||a.caption||'Reklam')+' | NM GROUP';document.querySelector('#description').content=a.seo_description||a.caption||'İstanbul gayrimenkul ilanı';document.querySelector('#keywords').content=a.seo_keywords||'Istanbul emlak, gayrimenkul';document.querySelector('#canonical').href=location.origin+'/reklam/'+encodeURIComponent(a.slug);document.getElementById('pageTitle').textContent=a.seo_title||a.caption||'Reklam';document.getElementById('pageDesc').textContent=a.seo_description||'';document.getElementById('content').className='detail';document.getElementById('content').innerHTML='<img src="'+esc(img(a))+'" alt="'+esc(a.seo_title||a.caption||'NM GROUP advertisement')+'"><div class="meta">'+(a.caption?'<div class="cap">'+esc(a.caption)+'</div>':'')+(a.seo_title?'<div class="seo">'+esc(a.seo_title)+'</div>':'')+(a.seo_description?'<div class="text">'+esc(a.seo_description)+'</div>':'')+(a.seo_keywords?'<div class="text"><b>Keywords:</b> '+esc(a.seo_keywords)+'</div>':'')+'<a class="wa" target="_blank" rel="noopener" href="'+esc(wa(a))+'">WhatsApp — Bilgi Al</a></div>'}
function card(a){return '<article class="card"><a class="pic" target="_blank" rel="noopener" href="'+esc(wa(a))+'"><img loading="lazy" src="'+esc(img(a))+'" alt="'+esc(a.seo_title||a.caption||'NM GROUP advertisement')+'"></a><div class="meta">'+(a.caption?'<div class="cap">'+esc(a.caption)+'</div>':'')+(a.seo_title?'<div class="seo">'+esc(a.seo_title)+'</div>':'')+(a.seo_description?'<div class="text">'+esc(a.seo_description)+'</div>':'')+'<a class="wa" target="_blank" rel="noopener" href="'+esc(wa(a))+'">WhatsApp — Bilgi Al</a>'+(a.slug?'<a class="google" href="/reklam/'+encodeURIComponent(a.slug)+'">صفحه اختصاصی این تبلیغ / Google</a>':'')+'</div></article>'}
(async()=>{try{const data=await ads();const m=location.pathname.match(/^\/reklam\/([^/]+)\/?$/i)||new URLSearchParams(location.search).get('ad')&&[null,new URLSearchParams(location.search).get('ad')];const slug=m&&m[1];if(slug){const a=data.find(x=>String(x.slug)===String(decodeURIComponent(slug)));if(a)detail(a);else document.getElementById('content').innerHTML='<div class="err">این تبلیغ دیگر فعال نیست یا حذف شده است.</div>'}else{document.getElementById('content').innerHTML=data.map(card).join('')||'<div class="empty">در حال حاضر تبلیغ فعالی وجود ندارد.</div>'}}catch(e){console.error(e);document.getElementById('content').innerHTML='<div class="err">نمایش تبلیغات در حال حاضر ممکن نیست.</div>'}})();
</script></body></html>
