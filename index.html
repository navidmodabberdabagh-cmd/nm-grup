<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NM GROUP</title>

<style>
:root{
  --bg:#03050d;
  --panel:#0b1020;
  --panel2:#121a31;
  --gold:#e8c36d;
  --gold2:#fff0b0;
  --text:#f7f8fc;
  --muted:#9ca6bd;
  --line:rgba(232,195,109,.28);
  --shadow:0 35px 100px rgba(0,0,0,.55);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 50% 0%,#1c2349 0%,#090d1d 38%,#02040b 80%);
  color:var(--text);
}

body{
  overflow-x:hidden;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

#stars{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
}

.star{
  position:absolute;
  width:2px;
  height:2px;
  border-radius:50%;
  background:white;
  opacity:.45;
  animation:twinkle 4s infinite alternate;
}

@keyframes twinkle{
  from{opacity:.05;transform:scale(.5)}
  to{opacity:.55;transform:scale(1.4)}
}

header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:78px;
  z-index:50;
  padding:0 5vw;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:linear-gradient(#02040de8,transparent);
  backdrop-filter:blur(14px);
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:7px;
}

.logo span{
  color:var(--gold);
}

.lang-current{
  color:white;
  background:rgba(255,255,255,.04);
  border:1px solid var(--line);
  border-radius:50px;
  padding:11px 19px;
}

main{
  width:min(1150px,92vw);
  margin:auto;
  min-height:100vh;
  padding:105px 0 70px;
  position:relative;
  z-index:2;
}

.screen{
  display:none;
  opacity:0;
  transform:
    perspective(1400px)
    translate3d(120px,0,-180px)
    rotateY(-11deg)
    scale(.94);
}

.screen.active{
  display:block;
  animation:screenIn .72s cubic-bezier(.18,.82,.2,1) forwards;
}

.screen.leave{
  display:block;
  animation:screenOut .42s cubic-bezier(.4,0,.7,1) forwards;
}

@keyframes screenIn{
  0%{
    opacity:0;
    transform:
      perspective(1400px)
      translate3d(130px,0,-220px)
      rotateY(-13deg)
      scale(.92);
  }
  100%{
    opacity:1;
    transform:
      perspective(1400px)
      translate3d(0,0,0)
      rotateY(0)
      scale(1);
  }
}

@keyframes screenOut{
  0%{
    opacity:1;
    transform:
      perspective(1400px)
      translate3d(0,0,0)
      rotateY(0)
      scale(1);
  }
  100%{
    opacity:0;
    transform:
      perspective(1400px)
      translate3d(-150px,0,-220px)
      rotateY(13deg)
      scale(.92);
  }
}

.hero{
  text-align:center;
  padding:30px 0 20px;
}

.kicker{
  color:var(--gold);
  font-size:11px;
  letter-spacing:7px;
  text-transform:uppercase;
}

.hero h1{
  margin:15px 0 10px;
  font-size:clamp(45px,9vw,100px);
  letter-spacing:8px;
  text-shadow:
    0 5px 0 #8d7134,
    0 15px 45px rgba(232,195,109,.22);
}

.hero p{
  color:var(--muted);
  line-height:1.8;
}

.panel{
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(
      145deg,
      rgba(21,28,55,.96),
      rgba(6,9,19,.96)
    );
  border:1px solid var(--line);
  border-radius:30px;
  padding:clamp(22px,4vw,45px);
  box-shadow:var(--shadow);
}

.panel:before{
  content:"";
  position:absolute;
  width:400px;
  height:400px;
  right:-200px;
  top:-200px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(232,195,109,.09),transparent 65%);
  pointer-events:none;
}

.panel:after{
  content:"";
  position:absolute;
  top:-100%;
  left:-30%;
  width:25%;
  height:300%;
  background:rgba(255,255,255,.035);
  transform:rotate(20deg);
  animation:sheen 9s linear infinite;
  pointer-events:none;
}

@keyframes sheen{
  from{left:-30%}
  to{left:140%}
}

.title{
  margin:8px 0;
  font-size:clamp(28px,5vw,50px);
  text-shadow:0 8px 30px rgba(0,0,0,.35);
}

.desc{
  color:var(--muted);
  line-height:1.8;
}

.ad{
  margin-bottom:22px;
  padding:25px;
  border:1px solid var(--line);
  border-radius:23px;
  text-align:center;
  background:rgba(255,255,255,.025);
  box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.ad strong{
  display:block;
  color:var(--gold2);
  font-size:23px;
  margin-bottom:7px;
  text-shadow:0 0 25px rgba(232,195,109,.2);
}

.ad span{
  color:var(--muted);
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.three{
  grid-template-columns:repeat(3,1fr);
}

.lang-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-top:30px;
}

.type-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:14px;
  margin-top:30px;
}

.card{
  position:relative;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.12);
  border-radius:23px;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.075),
      rgba(255,255,255,.015)
    );
  color:white;
  padding:24px;
  min-height:125px;
  text-align:left;
  transition:.4s cubic-bezier(.2,.8,.2,1);
}

.card:hover{
  transform:
    translateY(-8px)
    rotateX(2deg)
    scale(1.015);
  border-color:var(--gold);
  box-shadow:
    0 25px 70px rgba(0,0,0,.45),
    0 0 35px rgba(232,195,109,.08);
}

.card b{
  display:block;
  font-size:18px;
  margin-bottom:8px;
}

.card small{
  color:var(--muted);
  line-height:1.55;
}

.type-card{
  min-height:190px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.type-icon{
  font-size:42px;
  color:var(--gold2);
  text-shadow:0 8px 30px rgba(232,195,109,.2);
}

.type-card b{
  font-size:19px;
  letter-spacing:2px;
}

.progress{
  display:flex;
  gap:7px;
  margin-bottom:22px;
}

.dot{
  height:4px;
  flex:1;
  border-radius:20px;
  background:#222a43;
}

.dot.on{
  background:linear-gradient(90deg,var(--gold),var(--gold2));
  box-shadow:0 0 15px rgba(232,195,109,.25);
}

.sub{
  border-top:1px solid rgba(255,255,255,.07);
  padding-top:25px;
  margin-top:28px;
}

.sub h3{
  color:var(--gold2);
  font-size:15px;
  margin:0 0 14px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.field label{
  color:var(--muted);
  font-size:12px;
}

input,
select,
textarea{
  width:100%;
  padding:14px 15px;
  border-radius:15px;
  border:1px solid rgba(255,255,255,.12);
  outline:none;
  background:#10172b;
  color:white;
  transition:.25s;
}

select option{
  background:#11172b;
  color:white;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(232,195,109,.09);
}

textarea{
  min-height:145px;
  resize:vertical;
}

.options{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
}

.option{
  padding:11px 15px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.035);
  color:white;
  transition:.25s;
}

.option:hover{
  transform:translateY(-2px);
}

.option.selected{
  border-color:var(--gold);
  background:rgba(232,195,109,.13);
  color:var(--gold2);
  box-shadow:0 0 25px rgba(232,195,109,.08);
}

.check-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.check{
  display:flex;
  align-items:center;
  gap:9px;
  padding:12px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.025);
  color:var(--muted);
  font-size:12px;
}

.check input{
  width:auto;
}

.nav{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-top:32px;
}

.btn{
  padding:14px 23px;
  border-radius:15px;
  border:1px solid rgba(255,255,255,.12);
  font-weight:800;
  transition:.3s;
}

.btn:hover{
  transform:translateY(-3px);
}

.primary{
  color:#111;
  background:linear-gradient(135deg,var(--gold2),var(--gold));
  box-shadow:0 12px 40px rgba(232,195,109,.12);
}

.secondary{
  color:white;
  background:rgba(255,255,255,.05);
}

.hidden{
  display:none!important;
}

.note{
  color:#7e89a4;
  font-size:11px;
  line-height:1.6;
  margin-top:8px;
}

.photo-row{
  display:flex;
  align-items:center;
  gap:15px;
}

.avatar{
  width:78px;
  height:78px;
  object-fit:cover;
  border-radius:50%;
  border:1px solid var(--line);
  background:#17203a;
}

.history{
  display:grid;
  gap:12px;
}

.request-card{
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  background:rgba(255,255,255,.025);
}

.request-card strong{
  color:var(--gold2);
}

.success{
  text-align:center;
  padding:60px 0;
}

.success-icon{
  width:110px;
  height:110px;
  margin:0 auto 25px;
  display:grid;
  place-items:center;
  border:1px solid var(--gold);
  border-radius:50%;
  color:var(--gold2);
  font-size:48px;
  box-shadow:0 0 80px rgba(232,195,109,.14);
}

footer{
  position:relative;
  z-index:2;
  text-align:center;
  padding:25px;
  color:#68738d;
  font-size:11px;
}

.footer-brand{
  color:var(--gold);
  letter-spacing:5px;
}

.rtl{
  direction:rtl;
}

.rtl .card,
.rtl .panel{
  text-align:right;
}

.rtl .nav{
  flex-direction:row-reverse;
}

@media(max-width:900px){
  .type-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .check-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .three{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:650px){
  header{
    padding:0 20px;
  }

  .logo{
    font-size:20px;
    letter-spacing:5px;
  }

  main{
    width:94vw;
  }

  .grid,
  .three,
  .lang-grid,
  .type-grid,
  .check-grid{
    grid-template-columns:1fr;
  }

  .panel{
    padding:22px;
    border-radius:24px;
  }

  .type-card{
    min-height:145px;
  }

  .nav{
    flex-direction:column;
  }

  .btn{
    width:100%;
  }

  .hero h1{
    font-size:42px;
  }
}
</style>
</head>

<body>

<div id="stars"></div>

<header>
  <div class="logo">NM <span>GROUP</span></div>
  <button class="lang-current" id="languageButton" onclick="go('language')">
    Türkçe
  </button>
</header>

<main>

<!-- =========================================================
     LANGUAGE
========================================================= -->

<section id="language" class="screen active">

  <div class="hero">

    <div class="kicker">NM GROUP</div>

    <h1 id="brandTitle">GAYRİMENKUL</h1>

    <p id="brandTag"></p>

    <div class="lang-grid">

      <button class="card" onclick="setLanguage('tr')">
        <b>Türkçe</b>
        <small>Türkçe devam edin</small>
      </button>

      <button class="card" onclick="setLanguage('fa')">
        <b>فارسی</b>
        <small>ادامه به زبان فارسی</small>
      </button>

      <button class="card" onclick="setLanguage('en')">
        <b>English</b>
        <small>Continue in English</small>
      </button>

      <button class="card" onclick="setLanguage('ar')">
        <b>العربية</b>
        <small>المتابعة باللغة العربية</small>
      </button>

      <button class="card" onclick="setLanguage('ru')">
        <b>Русский</b>
        <small>Продолжить на русском</small>
      </button>

      <button class="card" onclick="setLanguage('uk')">
        <b>Українська</b>
        <small>Продовжити українською</small>
      </button>

    </div>

  </div>

</section>


<!-- =========================================================
     WELCOME
========================================================= -->

<section id="welcome" class="screen">

  <div class="ad">
    <strong>NM GROUP</strong>
    <span data-text="advertisement"></span>
  </div>

  <div class="panel">

    <div class="kicker">NM GROUP</div>

    <h2 class="title" data-text="welcome"></h2>

    <p class="desc" data-text="welcomeDesc"></p>

    <div class="grid">

      <button class="card" onclick="go('register')">
        <b data-text="register"></b>
        <small data-text="registerSmall"></small>
      </button>

      <button class="card" onclick="go('login')">
        <b data-text="login"></b>
        <small data-text="loginSmall"></small>
      </button>

      <button class="card" onclick="startGuest()">
        <b data-text="guest"></b>
        <small data-text="guestSmall"></small>
      </button>

      <button class="card" onclick="go('history')">
        <b data-text="requests"></b>
        <small data-text="requestsSmall"></small>
      </button>

      <button class="card" onclick="go('seller')">
        <b data-text="sell"></b>
        <small data-text="sellSmall"></small>
      </button>

    </div>

  </div>

</section>


<!-- =========================================================
     REGISTER
========================================================= -->

<section id="register" class="screen">

  <div class="panel">

    <div class="kicker">NM GROUP</div>

    <h2 class="title" data-text="registerTitle"></h2>

    <p class="desc" data-text="registerDesc"></p>

    <div class="grid">

      <div class="field">
        <label data-text="firstName"></label>
        <input id="registerFirst">
      </div>

      <div class="field">
        <label data-text="lastName"></label>
        <input id="registerLast">
      </div>

      <div class="field">
        <label data-text="phone"></label>
        <input id="registerPhone" type="tel">
      </div>

      <div class="field">
        <label data-text="email"></label>
        <input id="registerEmail" type="email">
      </div>

      <div class="field">
        <label data-text="password"></label>
        <input id="registerPassword" type="password">
      </div>

      <div class="field">
        <label data-text="displayName"></label>
        <input id="registerDisplay">
      </div>

      <div class="field" style="grid-column:1/-1">

        <label data-text="profilePhoto"></label>

        <div class="photo-row">

          <img id="profilePreview" class="avatar">

          <input
            id="registerPhoto"
            type="file"
            accept="image/*"
            onchange="previewProfilePhoto(this)"
          >

        </div>

      </div>

      <label class="check" style="grid-column:1/-1">

        <input id="registerTapu" type="checkbox">

        <span data-text="ownTapu"></span>

      </label>

    </div>

    <div class="nav">

      <button class="btn secondary"
              onclick="go('welcome')"
              data-text="back">
      </button>

      <button class="btn primary"
              onclick="registerUser()"
              data-text="register">
      </button>

    </div>

  </div>

</section>


<!-- =========================================================
     LOGIN
========================================================= -->

<section id="login" class="screen">

  <div class="panel">

    <div class="kicker">NM GROUP</div>

    <h2 class="title" data-text="loginTitle"></h2>

    <div class="grid">

      <div class="field">
        <label data-text="email"></label>
        <input id="loginEmail" type="email">
      </div>

      <div class="field">
        <label data-text="password"></label>
        <input id="loginPassword" type="password">
      </div>

    </div>

    <div class="nav">

      <button class="btn secondary"
              onclick="go('welcome')"
              data-text="back">
      </button>

      <button class="btn primary"
              onclick="loginUser()"
              data-text="login">
      </button>

    </div>

  </div>

</section>


<!-- =========================================================
     PROFILE
========================================================= -->

<section id="profile" class="screen">

  <div class="panel">

    <div class="kicker">NM GROUP</div>

    <h2 class="title" data-text="profile"></h2>

    <div id="profileContent"></div>

    <div class="nav">

      <button class="btn secondary"
              onclick="go('welcome')"
              data-text="back">
      </button>

      <button class="btn primary"
              onclick="go('history')"
              data-text="requests">
      </button>

    </div>

  </div>

</section>


<!-- =========================================================
     HISTORY
========================================================= -->

<section id="history" class="screen">

  <div class="panel">

    <div class="kicker">NM GROUP</div>

    <h2 class="title" data-text="requests"></h2>

    <p class="desc" data-text="historyDescription"></p>

    <div id="historyContent" class="history"></div>

    <div class="nav">

      <button class="btn secondary"
              onclick="go('welcome')"
              data-text="back">
      </button>

      <button class="btn primary"
              onclick="startGuest()"
              data-text="newRequest">
      </button>

    </div>

  </div>

</section>


<!-- =========================================================
     PROPERTY TYPE
========================================================= -->

<section id="type" class="screen">

  <div class="progress">
    <i class="dot on"></i>
    <i class="dot"></i>
    <i class="dot"></i>
    <i class="dot"></i>
  </div>

  <div class="panel">

    <div class="kicker">01</div>

    <h2 class="title" data-text="propertyQuestion"></h2>

    <p class="desc" data-text="propertyQuestionDesc"></p>

    <div class="type-grid">

      <button class="card type-card"
              onclick="choosePropertyType('daire')">

        <span class="type-icon">⌂</span>

        <b data-text="daire"></b>

        <small data-text="daireDesc"></small>

      </button>


      <button class="card type-card"
              onclick="choosePropertyType('villa')">

        <span class="type-icon">⌂</span>

        <b data-text="villa"></b>

        <small data-text="villaDesc"></small>

      </button>


      <button class="card type-card"
              onclick="choosePropertyType('dukkân')">

        <span class="type-icon">▣</span>

        <b data-text="dukkân"></b>

        <small data-text="dukkânDesc"></small>

      </button>


      <button class="card type-card"
              onclick="choosePropertyType('fabrika')">

        <span class="type-icon">▤</span>

        <b data-text="fabrika"></b>

        <small data-text="fabrikaDesc"></small>

      </button>


      <button class="card type-card"
              onclick="choosePropertyType('arsa')">

        <span class="type-icon">◇</span>

        <b data-text="arsa"></b>

        <small data-text="arsaDesc"></small>

      </button>

    </div>

  </div>

</section>


<!-- =========================================================
     PROPERTY SPECIFIC
========================================================= -->

<section id="property" class="screen">

  <div class="progress">
    <i class="dot on"></i>
    <i class="dot on"></i>
    <i class="dot"></i>
    <i class="dot"></i>
  </div>

  <div class="panel">

    <div class="kicker">02</div>

    <h2 class="title" id="propertyTitle"></h2>

    <div id="propertyFields"></div>

    <div class="nav">

      <button class="btn secondary"
              onclick="go('type')"
              data-text="back">
      </button>

      <button class="btn primary"
              onclick="goDetails()"
              data-text="continue">
      </button>

    </div>

  </div>

</section>


<!-- =========================================================
     LOCATION / SITE / FEATURES
========================================================= -->

<section id="details" class="screen">

  <div class="progress">
    <i class="dot on"></i>
    <i class="dot on"></i>
    <i class="dot on"></i>
    <i class="dot"></i>
  </div>

  <div class="panel">

    <div class="kicker">03</div>

    <h2 class="title" data-text="detailsTitle"></h2>

    <div id="detailsFields"></div>

    <div class="nav">

      <button class="btn secondary"
              onclick="go('property')"
              data-text="back">
      </button>

      <button class="btn primary"
              onclick="goFinal()"
              data-text="continue">
      </button>

    </div>

  </div>

</section>


<!-- =========================================================
     FINAL REQUEST
========================================================= -->

<section id="final" class="screen">

  <div class="progress">
    <i class="dot on"></i>
    <i class="dot on"></i>
    <i class="dot on"></i>
    <i class="dot on"></i>
  </div>

  <div class="panel">

    <div class="kicker">04</div>

    <h2 class="title" data-text="finalTitle"></h2>

    <p class="desc" data-text="finalDescription"></p>

    <div class="field">

      <label data-text="specialRequests"></label>

      <textarea
        id="specialRequests"
        data-placeholder="specialPlaceholder">
      </textarea>

    </div>


    <div class="sub">

      <h3 data-text="transport"></h3>

      <div class="check-grid" id="transportOptions"></div>

    </div>

function t(key){
  return LANG[currentLanguage]?.[key] ||

/* =========================================================
   APPLY LANGUAGE
========================================================= */

function applyLanguage(){

  document.documentElement.lang=currentLanguage;

  document.body.classList.toggle(
    "rtl",
    currentLanguage==="fa" ||
    currentLanguage==="ar"
  );

  document.getElementById("brandTitle").textContent=t("brand");
  document.getElementById("brandTag").textContent=t("tag");
  document.getElementById("footerText").textContent=t("footer");

  const languageNames={
    tr:"Türkçe",
    fa:"فارسی",
    en:"English",
    ar:"العربية",
    ru:"Русский",
    uk:"Українська"
  };

  document.getElementById("languageButton").textContent=
    languageNames[currentLanguage];

  document.querySelectorAll("[data-text]").forEach(el=>{
    el.innerHTML=t(el.dataset.text);
  });

  document.querySelectorAll("[data-placeholder]").forEach(el=>{
    el.placeholder=t(el.dataset.placeholder);
  });

  renderSellerTypes();

  if(selectedPropertyType){
    renderPropertyFields();
    renderDetailsFields();
  }

}

function setLanguage(language){

  currentLanguage=language;

  localStorage.setItem(
    "nm_language",
    language
  );

  applyLanguage();

  go("welcome");
}


/* =========================================================
   NAVIGATION
========================================================= */

function go(id){

  const old=document.querySelector(".screen.active");
  const next=document.getElementById(id);

  if(!next || old===next){
    if(id==="history") renderHistory();
    if(id==="profile") renderProfile();
    return;
  }

  if(old){

    old.classList.remove("active");
    old.classList.add("leave");

    setTimeout(()=>{
      old.classList.remove("leave");
    },430);

  }

  next.classList.add("active");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

  if(id==="history") renderHistory();

  if(id==="profile") renderProfile();

}

/* =========================================================

function inputField(label,id,type="text"){

  return `
    <div class="field">
      <label>${label}</label>
      <input id="${id}" type="${type}">
    </div>
  `;

}


function selectField(label,id,options){

  return `
    <div class="field">
      <label>${label}</label>

      <select id="${id}">

        <option value="">${t("noPreference")}</option>

        ${options.map(
          x=>`<option value="${x}">${x}</option>`
        ).join("")}

      </select>

    </div>
  `;

}


function optionButtons(id,items){

  return `
    <div class="options" id="${id}">

      ${items.map(item=>`

        <button
          type="button"
          class="option"
          data-value="${item}"
          onclick="toggleOption(this)"
        >
          ${item}
        </button>

      `).join("")}

    </div>
  `;

}


function toggleOption(button){

  button.classList.toggle("selected");

}


function getSelected(id){

  return [
    ...document.querySelectorAll(
      `#${id} .option.selected`
    )
  ].map(
    x=>x.dataset.value
  );

}

/* =========================================================
   BUILDING / SITE
========================================================= */

function chooseBuilding(button,type){

  document
    .querySelectorAll("[data-building]")
    .forEach(
      x=>x.classList.remove("selected")
    );

  button.classList.add("selected");

  const siteContainer=
    document.getElementById("siteContainer");

  const facilities=
    document.getElementById("siteFacilities");

  if(type==="site"){

    siteContainer.classList.remove("hidden");

    loadSites();

  }else{

    siteContainer.classList.add("hidden");

    facilities.classList.add("hidden");

  }

}


/* =========================================================
   DISTRICTS
========================================================= */

function loadDistricts(){

  const side=
    document.getElementById("side");

  const district=
    document.getElementById("district");

  const neighborhood=
    document.getElementById("neighborhood");

  if(!side || !district)return;

  const list=
    districts[
      side.value==="Avrupa Yakası"
        ? "avrupa"
        : side.value==="Anadolu Yakası"
          ? "anadolu"
          : ""
    ] || [];

  district.innerHTML=
    `<option value="">${t("noPreference")}</option>`+
    list.map(
      x=>`<option value="${x}">${x}</option>`
    ).join("");

  neighborhood.innerHTML=
    `<option value="">${t("noPreference")}</option>`;

}


/* =========================================================
   NEIGHBORHOODS
========================================================= */

function loadNeighborhoods(){

  const district=
    document.getElementById("district");

  const neighborhood=
    document.getElementById("neighborhood");

  const list=
    neighborhoods[district.value] || [];

  neighborhood.innerHTML=
    `<option value="">${t("noPreference")}</option>`+
    list.map(
      x=>`<option value="${x}">${x}</option>`
    ).join("");

  loadSites();

}


/* =========================================================
   SITES
========================================================= */

function loadSites(){

  const neighborhood=
    document.getElementById("neighborhood");

  const siteName=
    document.getElementById("siteName");

  if(!neighborhood || !siteName)return;

  const list=
    sites[neighborhood.value] || [];

  siteName.innerHTML=
    `<option value="">${t("allSites")}</option>`+
    list.map(
      x=>`<option value="${x}">${x}</option>`
    ).join("")+
    `<option value="other">
      ${currentLanguage==="fa"
        ?"سایت دیگر / نام سایت را می‌نویسم"
        :"Diğer / site adını yazacağım"}
    </option>`;

  siteName.onchange=()=>{

    const facilities=
      document.getElementById("siteFacilities");

    if(siteName.value){

      facilities.classList.remove("hidden");

    }else{

      facilities.classList.add("hidden");

    }

  };

}

    );

  if(
    !user ||
    user.email!==valueOf("loginEmail") ||
    user.password!==valueOf("loginPassword")
  ){

    alert(
      currentLanguage==="fa"
        ?"اطلاعات ورود صحیح نیست."
        :"Giriş bilgileri eşleşmedi."
    );

    return;

  }


  go("profile");

}

/* =========================================================
   HISTORY
========================================================= */

function renderHistory(){

  const box=
    document.getElementById(
      "historyContent"
    );

  const requests=
    JSON.parse(
      localStorage.getItem("nm_requests") || "[]"
    );

  const user=
    JSON.parse(
      localStorage.getItem("nm_user") || "null"
    );


  let list=requests;


  if(user){

    list=requests.filter(
      x=>
        x.contact &&
        x.contact.email===user.email
    );

  }


  if(!list.length){

    box.innerHTML=
      `<div class="desc">
        ${t("historyDescription")}
      </div>`;

    return;

  }


  box.innerHTML=
    list.map(
      request=>`

        <div class="request-card">

          <strong>
            ${request.id}
          </strong>

          <div style="margin-top:8px">

            ${t(request.type)}

          </div>

          <div class="desc">

            ${
              request.property?.district || ""
            }

            /

            ${
              request.property?.neighborhood || ""
            }

            ${
              request.property?.site
                ? "/ "+request.property.site
                : ""
            }

            <br>

            ${
              request.specialRequests || ""
            }

          </div>

        </div>

      `
    ).join("");

}

/* =========================================================
   SELLER REQUEST
========================================================= */

function submitSellerRequest(){

  const name=
    valueOf("sellerName");

  const phone=
    valueOf("sellerPhone");


  if(!name || !phone){

    alert(
      currentLanguage==="fa"
        ?"نام و شماره تلفن الزامی است."
        :"Ad Soyad ve telefon zorunludur."
    );

    return;

  }


  const sellers=
    JSON.parse(
      localStorage.getItem("nm_sellers") || "[]"
    );


  const seller={

    id:
      "SELL-"+
      String(
        sellers.length+1
      ).padStart(6,"0"),

    type:
      valueOf("sellerType"),

    name:name,

    phone:phone,

    email:
      valueOf("sellerEmail"),

    address:
      valueOf("sellerAddress"),

    price:
      valueOf("sellerPrice"),

    area:
      valueOf("sellerArea"),

    description:
      valueOf("sellerDescription"),

    createdAt:
      new Date().toISOString()

  };


  sellers.push(seller);


  localStorage.setItem(
    "nm_sellers",
    JSON.stringify(sellers)
  );


  sendTelegram(
    "NEW PROPERTY SALE REQUEST",
    seller
  );


  sendSellerPhotos();


  document.getElementById(
    "successMessage"
  ).innerHTML=t("successText");


  go("success");

}


/* =========================================================
   TELEGRAM MESSAGE
========================================================= */

async function sendTelegram(title,data){

  if(
    !TELEGRAM.BOT_TOKEN ||
    !TELEGRAM.CHAT_ID
  ){

    console.log(
      "Telegram is not configured yet.",
      title,
      data
    );

    return;

  }


  try{

    const clean=
      JSON.parse(
        JSON.stringify(data)
      );


    if(clean.photo){

      delete clean.photo;

    }


    await fetch(
      `https://api.telegram.org/bot${TELEGRAM.BOT_TOKEN}/sendMessage`,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({

          chat_id:
            TELEGRAM.CHAT_ID,

          text:
            title+
            "\n\n"+
            JSON.stringify(
              clean,
              null,
              2
            ).slice(0,3900)

        })

      }
    );

  }catch(error){

    console.error(
      "Telegram error:",
      error
    );

  }

}


/* =========================================================
   TELEGRAM PHOTO
========================================================= */

async function sendTelegramPhoto(
  dataUrl,
  caption
){

  if(
    !TELEGRAM.BOT_TOKEN ||
    !TELEGRAM.CHAT_ID ||
    !dataUrl
  ){

    return;

  }


  try{

    const blob=
      await(
        await fetch(dataUrl)
      ).blob();


    const form=
      new FormData();

    form.append(
      "chat_id",
      TELEGRAM.CHAT_ID
    );

    form.append(
      "caption",
      caption
    );

    form.append(
      "photo",
      blob,
      "profile.jpg"
    );


    await fetch(
      `https://api.telegram.org/bot${TELEGRAM.BOT_TOKEN}/sendPhoto`,
      {
        method:"POST",
        body:form
      }
    );

  }catch(error){

    console.error(
      "Telegram photo error:",
      error
    );

  }

}


/* =========================================================
   SELLER PHOTOS
========================================================= */

async function sendSellerPhotos(){

  if(
    !TELEGRAM.BOT_TOKEN ||
    !TELEGRAM.CHAT_ID
  ){

    return;

  }


  const files=
    document.getElementById(
      "sellerPhotos"
    ).files;


  for(
    const file of files
  ){

    try{

      const form=
        new FormData();

      form.append(
        "chat_id",
        TELEGRAM.CHAT_ID
      );

      form.append(
        "caption",
        "NM GROUP — PROPERTY SALE PHOTO"
      );

      form.append(
        "photo",
        file
      );


      await fetch(
        `https://api.telegram.org/bot${TELEGRAM.BOT_TOKEN}/sendPhoto`,
        {
          method:"POST",
          body:form
        }
      );

    }catch(error){

      console.error(
        error
      );

    }

  }

}
