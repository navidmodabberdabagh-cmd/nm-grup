<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050712">
<title>NM GROUP — Real Estate</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@500;600;700;800&display=swap');

*{box-sizing:border-box;margin:0;padding:0}

:root{
 --gold:#e1bd70;
 --gold2:#ffe2a0;
 --bg:#03050d;
 --panel:rgba(13,18,34,.82);
 --line:rgba(225,189,112,.28);
 --white:#f7f8fb;
 --muted:#a6adbf;
}

html{scroll-behavior:smooth}

body{
 font-family:Inter,Arial,sans-serif;
 color:var(--white);
 background:
 radial-gradient(circle at 50% 35%,rgba(78,88,180,.22),transparent 35%),
 radial-gradient(circle at 10% 80%,rgba(0,180,255,.08),transparent 30%),
 var(--bg);
 min-height:100vh;
 overflow-x:hidden;
}

button,input,select,textarea{font:inherit}

.space{
 position:fixed;
 inset:0;
 z-index:0;
 pointer-events:none;
 overflow:hidden;
}

.space:before{
 content:"";
 position:absolute;
 inset:0;
 background-image:
 radial-gradient(circle,rgba(255,255,255,.8) 1px,transparent 1px),
 radial-gradient(circle,rgba(120,210,255,.5) 1px,transparent 1px);
 background-size:90px 90px,145px 145px;
 opacity:.14;
}

.orbit{
 position:absolute;
 border:1px solid rgba(120,170,255,.1);
 border-radius:50%;
}

.orbit.a{
 width:850px;height:850px;
 left:-300px;top:-250px;
 transform:rotate(-20deg);
}

.orbit.b{
 width:1100px;height:500px;
 right:-400px;bottom:-180px;
 transform:rotate(-12deg);
}

.glow{
 position:absolute;
 width:500px;height:500px;
 left:50%;top:40%;
 transform:translate(-50%,-50%);
 border-radius:50%;
 background:rgba(95,90,255,.12);
 filter:blur(90px);
}

header{
 position:fixed;
 z-index:50;
 top:0;left:0;right:0;
 height:76px;
 padding:0 5vw;
 display:flex;
 align-items:center;
 justify-content:space-between;
 background:linear-gradient(to bottom,rgba(3,5,13,.94),rgba(3,5,13,.15));
 backdrop-filter:blur(8px);
}

.logo{
 font-family:Montserrat,sans-serif;
 font-size:21px;
 font-weight:800;
 letter-spacing:4px;
}

.logo span{color:var(--gold2)}

.lang-current{
 padding:9px 15px;
 border:1px solid var(--line);
 border-radius:30px;
 background:rgba(255,255,255,.04);
 font-size:12px;
}

.app{
 position:relative;
 z-index:2;
 width:min(1150px,94%);
 margin:auto;
 padding:105px 0 55px;
 min-height:100vh;
}

.screen{display:none;min-height:calc(100vh - 150px)}

.screen.active{
 display:flex;
 flex-direction:column;
}

.language-screen{
 justify-content:center;
 align-items:center;
 text-align:center;
}

.kicker{
 color:var(--gold2);
 font-size:10px;
 letter-spacing:6px;
 margin-bottom:22px;
}

.hero{
 font-family:Montserrat,sans-serif;
 font-size:clamp(42px,8vw,88px);
 letter-spacing:8px;
 font-weight:700;
 margin-bottom:18px;
 text-shadow:0 0 50px rgba(225,189,112,.18);
}

.hero-sub{
 max-width:680px;
 color:var(--muted);
 line-height:1.9;
 margin-bottom:42px;
}

.languages{
 width:min(850px,100%);
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:14px;
}

.lang-btn{
 appearance:none;
 border:1px solid var(--line);
 background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.025));
 color:#fff;
 min-height:68px;
 border-radius:18px;
 cursor:pointer;
 transition:.4s;
 backdrop-filter:blur(12px);
}

.lang-btn:hover{
 transform:translateY(-7px) scale(1.025);
 border-color:var(--gold2);
 box-shadow:0 18px 45px rgba(225,189,112,.12);
}

.lang-btn:active{transform:scale(.97)}

.panel{
 background:
 linear-gradient(145deg,rgba(22,28,51,.86),rgba(5,8,17,.9));
 border:1px solid var(--line);
 border-radius:28px;
 padding:34px;
 box-shadow:
 0 30px 90px rgba(0,0,0,.5),
 inset 0 1px rgba(255,255,255,.05);
 backdrop-filter:blur(20px);
}

.screen.active .panel{
 animation:panelIn .8s cubic-bezier(.15,.8,.2,1);
}

@keyframes panelIn{
 0%{opacity:0;transform:perspective(1200px) translate3d(130px,0,-350px) rotateY(-12deg) scale(.9)}
 100%{opacity:1;transform:perspective(1200px) translate3d(0,0,0) rotateY(0) scale(1)}
}

.section-title{
 font-family:Montserrat,sans-serif;
 font-size:clamp(27px,4vw,43px);
 margin-bottom:10px;
}

.section-desc{
 color:var(--muted);
 line-height:1.8;
 margin-bottom:28px;
}

.ad-slot{
 width:min(900px,100%);
 min-height:105px;
 margin:0 auto 25px;
 border:1px solid rgba(225,189,112,.3);
 border-radius:20px;
 background:linear-gradient(110deg,rgba(225,189,112,.1),rgba(70,80,160,.08));
 display:flex;
 justify-content:center;
 align-items:center;
 text-align:center;
}

.ad-slot strong{
 display:block;
 color:var(--gold2);
 margin-bottom:6px;
}

.ad-slot span{
 color:var(--muted);
 font-size:12px;
}

.choice-grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
 gap:16px;
}

.choice{
 min-height:115px;
 padding:25px;
 border:1px solid rgba(255,255,255,.09);
 border-radius:20px;
 background:rgba(255,255,255,.035);
 cursor:pointer;
 transition:.35s;
}

.choice:hover{
 transform:translateY(-6px) translateZ(20px);
 border-color:var(--gold);
}

.choice strong{
 display:block;
 margin-bottom:8px;
}

.choice small{color:var(--muted)}

.form-grid{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:17px;
}

.field{
 display:flex;
 flex-direction:column;
 gap:8px;
}

.field.full{grid-column:1/-1}

label{
 color:var(--muted);
 font-size:12px;
}

input,select,textarea{
 width:100%;
 border:1px solid rgba(255,255,255,.12);
 border-radius:13px;
 padding:14px 15px;
 background:rgba(255,255,255,.045);
 color:#fff;
 outline:none;
}

select option{
 background:#101422;
 color:white;
}

input:focus,select:focus,textarea:focus{
 border-color:var(--gold);
 box-shadow:0 0 0 3px rgba(225,189,112,.07);
}

textarea{
 min-height:125px;
 resize:vertical;
}

.section{
 margin-top:30px;
 padding-top:5px;
}

.section h3{
 color:var(--gold2);
 font-size:14px;
 margin-bottom:13px;
}

.options{
 display:flex;
 flex-wrap:wrap;
 gap:9px;
}

.option{
 border:1px solid rgba(255,255,255,.1);
 background:rgba(255,255,255,.035);
 color:#fff;
 border-radius:12px;
 padding:11px 15px;
 cursor:pointer;
 transition:.25s;
 user-select:none;
}

.option:hover{
 border-color:var(--gold);
 transform:translateY(-2px);
}

.option.selected{
 background:rgba(225,189,112,.15);
 border-color:var(--gold2);
 box-shadow:0 0 25px rgba(225,189,112,.07);
}

.hidden{display:none!important}

.nav{
 display:flex;
 justify-content:space-between;
 gap:15px;
 margin-top:32px;
}

.btn{
 border:0;
 border-radius:14px;
 padding:15px 25px;
 cursor:pointer;
 font-weight:700;
 transition:.3s;
}

.btn-primary{
 background:linear-gradient(135deg,var(--gold2),var(--gold));
 color:#111;
}

.btn-primary:hover{
 transform:translateY(-3px);
 box-shadow:0 12px 35px rgba(225,189,112,.18);
}

.btn-secondary{
 color:white;
 background:rgba(255,255,255,.05);
 border:1px solid var(--line);
}

.property-types{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:14px;
}

.property-type{
 min-height:125px;
 display:flex;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 gap:8px;
 border:1px solid rgba(255,255,255,.1);
 border-radius:20px;
 cursor:pointer;
 background:rgba(255,255,255,.035);
 transition:.35s;
 text-align:center;
}

.property-type b{
 font-family:Montserrat,sans-serif;
 letter-spacing:1px;
}

.property-type:hover,
.property-type.selected{
 border-color:var(--gold2);
 background:rgba(225,189,112,.1);
 transform:translateY(-5px) scale(1.015);
}

.multiple-note{
 color:var(--muted);
 font-size:11px;
 margin-top:8px;
}

.success{
 justify-content:center;
 align-items:center;
 text-align:center;
}

.success-icon{
 width:100px;
 height:100px;
 border:1px solid var(--gold);
 border-radius:50%;
 display:grid;
 place-items:center;
 color:var(--gold2);
 font-size:42px;
 margin-bottom:25px;
 box-shadow:0 0 60px rgba(225,189,112,.1);
}

footer{
 position:relative;
 z-index:2;
 text-align:center;
 padding:30px;
 color:rgba(255,255,255,.35);
 font-size:10px;
}

.footer-brand{
 color:var(--gold);
 letter-spacing:4px;
}

@media(max-width:800px){
 .languages{grid-template-columns:repeat(2,1fr)}
 .property-types{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:600px){
 header{padding:0 18px}
 .app{width:94%;padding-top:92px}
 .panel{padding:22px;border-radius:22px}
 .form-grid{grid-template-columns:1fr}
 .field.full{grid-column:auto}
 .languages{grid-template-columns:1fr}
 .property-types{grid-template-columns:1fr 1fr}
 .nav{flex-direction:column-reverse}
 .btn{width:100%}
}
</style>
</head>

<body>

<div class="space">
 <div class="orbit a"></div>
 <div class="orbit b"></div>
 <div class="glow"></div>
</div>

<header>
 <div class="logo">NM <span>GROUP</span></div>
 <div class="lang-current" id="langCurrent">Türkçe</div>
</header>

<main class="app">

<!-- LANGUAGE -->

<section id="language" class="screen language-screen active">

 <div class="kicker">NM GROUP</div>

 <h1 class="hero">EMLAK</h1>

 <p class="hero-sub" id="languageIntro">
 İstanbul'da doğru gayrimenkulü bulmanın yeni nesil yolu.
 </p>

 <div class="languages">

  <button class="lang-btn" data-lang="tr">Türkçe</button>
  <button class="lang-btn" data-lang="fa">فارسی</button>
  <button class="lang-btn" data-lang="en">English</button>
  <button class="lang-btn" data-lang="ar">العربية</button>
  <button class="lang-btn" data-lang="ru">Русский</button>
  <button class="lang-btn" data-lang="uk">Українська</button>

 </div>

</section>

<!-- WELCOME -->

<section id="welcome" class="screen">

 <div class="ad-slot">
  <div>
   <strong>NM GROUP</strong>
   <span id="adBannerText"></span>
  </div>
 </div>

 <div class="panel">

  <div class="kicker">NM GROUP</div>

  <h2 class="section-title" id="welcomeTitle"></h2>
  <p class="section-desc" id="welcomeDesc"></p>

  <div class="choice-grid">

   <div class="choice" id="registerChoice">
    <strong id="registerTitle"></strong>
    <small id="registerSmall"></small>
   </div>

   <div class="choice" id="enterChoice">
    <strong id="enterTitle"></strong>
    <small id="enterSmall"></small>
   </div>

   <div class="choice" id="advertiseChoice">
    <strong id="advertiseTitle"></strong>
    <small id="advertiseSmall"></small>
   </div>

   <div class="choice" id="sellChoice">
    <strong id="sellTitle"></strong>
    <small id="sellSmall"></small>
   </div>

  </div>

 </div>

</section>

<!-- REGISTER -->

<section id="register" class="screen">

 <div class="panel">

  <div class="kicker">NM GROUP</div>
  <h2 class="section-title" id="regTitle"></h2>
  <p class="section-desc" id="regDesc"></p>

  <div class="form-grid">

   <div class="field">
    <label id="regFirstLabel"></label>
    <input id="regFirst">
   </div>

   <div class="field">
    <label id="regLastLabel"></label>
    <input id="regLast">
   </div>

   <div class="field">
    <label id="regPhoneLabel"></label>
    <input id="regPhone" type="tel">
   </div>

   <div class="field">
    <label id="regEmailLabel"></label>
    <input id="regEmail" type="email">
   </div>

   <div class="field">
    <label id="regPasswordLabel"></label>
    <input id="regPassword" type="password">
   </div>

   <div class="field">
    <label id="regPhotoLabel"></label>
    <input id="regPhoto" type="file" accept="image/*">
   </div>

  </div>

  <div class="section">
   <h3 id="regTapuTitle"></h3>
   <div class="options">
    <div class="option reg-tapu" data-value="yes"></div>
    <div class="option reg-tapu" data-value="no"></div>
   </div>
  </div>

  <div class="nav">
   <button class="btn btn-secondary" data-back="welcome" id="regBack"></button>
   <button class="btn btn-primary" id="regContinue"></button>
  </div>

 </div>

</section>

<!-- PROPERTY TYPE -->

<section id="propertyTypeScreen" class="screen">

 <div class="panel">

  <div class="kicker">01</div>
  <h2 class="section-title" id="typeTitle"></h2>
  <p class="section-desc" id="typeDesc"></p>

  <div class="property-types">

   <div class="property-type" data-type="daire">
    <b>DAİRE</b>
   </div>

   <div class="property-type" data-type="villa">
    <b>VİLLA</b>
   </div>

   <div class="property-type" data-type="dukkkan">
    <b>DÜKKÂN</b>
   </div>

   <div class="property-type" data-type="fabrika">
    <b>FABRİKA</b>
   </div>

   <div class="property-type" data-type="arsa">
    <b>ARSA</b>
   </div>

  </div>

  <div class="nav">
   <button class="btn btn-secondary" data-back="welcome" id="typeBack"></button>
  </div>

 </div>

</section>

<!-- PROPERTY FORM -->

<section id="property" class="screen">

 <div class="panel">

  <div class="kicker" id="propertyNumber">02</div>

  <h2 class="section-title" id="propertyTitle"></h2>
  <p class="section-desc" id="propertyDesc"></p>

  <!-- LOCATION -->

  <div class="section">
   <h3 id="locationTitle"></h3>

   <div class="form-grid">

    <div class="field">
     <label id="sideLabel"></label>
     <select id="side">
      <option value=""></option>
      <option value="avrupa"></option>
      <option value="anadolu"></option>
     </select>
    </div>

    <div class="field">
     <label id="districtLabel"></label>
     <select id="district"></select>
    </div>

    <div class="field">
     <label id="neighborhoodLabel"></label>
     <select id="neighborhood"></select>
    </div>

   </div>
  </div>

  <!-- SITE -->

  <div class="section">
   <h3 id="buildingTypeTitle"></h3>

   <div class="options">
    <div class="option building" data-value="normal"></div>
    <div class="option building" data-value="site"></div>
   </div>

   <div id="siteArea" class="hidden" style="margin-top:18px">
    <div class="field">
     <label id="siteNameLabel"></label>
     <select id="siteName"></select>
    </div>
   </div>

   <div id="siteFeatures" class="hidden">

    <div class="section">
     <h3 id="siteFeaturesTitle"></h3>

     <div class="options">
      <div class="option facility" data-value="openPool"></div>
      <div class="option facility" data-value="closedPool"></div>
      <div class="option facility" data-value="sauna"></div>
      <div class="option facility" data-value="fitness"></div>
      <div class="option facility" data-value="football"></div>
      <div class="option facility" data-value="security"></div>
     </div>
    </div>

   </div>
  </div>

  <!-- BASIC -->

  <div class="section">
   <h3 id="basicTitle"></h3>

   <div class="form-grid">

    <div class="field">
     <label id="priceLabel"></label>
     <input id="price">
    </div>

    <div class="field">
     <label id="sqmLabel"></label>
     <input id="sqm" type="number">
    </div>

    <div class="field">
     <label id="buildingAgeLabel"></label>
     <select id="buildingAge"></select>
    </div>

    <div class="field">
     <label id="floorCountLabel"></label>
     <select id="floorCount"></select>
    </div>

    <div class="field">
     <label id="floorLabel"></label>
     <select id="floor"></select>
    </div>

    <div class="field">
     <label id="bathLabel"></label>
     <select id="bath"></select>
    </div>

    <div class="field">
     <label id="wcLabel"></label>
     <select id="wc"></select>
    </div>

   </div>
  </div>

  <!-- ROOMS -->

  <div id="roomsSection" class="section">
   <h3 id="roomsTitle"></h3>
   <div class="options" id="roomsOptions"></div>
   <div class="multiple-note" id="roomsNote"></div>
  </div>

  <!-- KITCHEN -->

  <div id="kitchenSection" class="section">
   <h3 id="kitchenTitle"></h3>

   <div class="options">
    <div class="option kitchen" data-value="closed"></div>
    <div class="option kitchen" data-value="open"></div>
   </div>
  </div>

  <!-- COMMON -->

  <div class="section">
   <h3 id="commonTitle"></h3>

   <div class="options">

    <div class="option common" data-group="balcony" data-value="yes"></div>
    <div class="option common" data-group="balcony" data-value="no"></div>

    <div class="option common" data-group="elevator" data-value="yes"></div>
    <div class="option common" data-group="elevator" data-value="no"></div>

    <div class="option common" data-group="parking" data-value="yes"></div>
    <div class="option common" data-group="parking" data-value="no"></div>

    <div class="option common" data-group="furnished" data-value="yes"></div>
    <div class="option common" data-group="furnished" data-value="no"></div>

   </div>
  </div>

  <!-- TAPU -->

  <div class="section">
   <h3 id="tapuTitle"></h3>

   <div class="options">
    <div class="option tapu" data-value="kat-mulkiyeti"></div>
    <div class="option tapu" data-value="kat-irtifak"></div>
    <div class="option tapu" data-value="other"></div>
   </div>
  </div>

  <!-- CREDIT -->

  <div class="section">
   <h3 id="creditTitle"></h3>

   <div class="options">
    <div class="option credit" data-value="yes"></div>
    <div class="option credit" data-value="no"></div>
   </div>
  </div>

  <!-- VIEW / TRANSPORT -->

  <div class="section">
   <h3 id="viewTitle"></h3>

   <div class="options">
    <div class="option view" data-value="sea"></div>
    <div class="option view" data-value="bosporus"></div>
    <div class="option view" data-value="forest"></div>
    <div class="option view" data-value="city"></div>
   </div>
  </div>

  <div class="section">
   <h3 id="transportTitle"></h3>

   <div class="options">
    <div class="option transport" data-value="metro"></div>
    <div class="option transport" data-value="metrobus"></div>
    <div class="option transport" data-value="marmaray"></div>
    <div class="option transport" data-value="public"></div>
   </div>
  </div>

  <!-- DESCRIPTION -->

  <div class="section">
   <h3 id="notesTitle"></h3>

   <textarea id="notes"></textarea>
  </div>

  <!-- CONTACT -->

  <div class="section">
   <h3 id="contactTitle"></h3>

   <div class="form-grid">

    <div class="field">
     <label id="firstLabel"></label>
     <input id="first">
    </div>

    <div class="field">
     <label id="lastLabel"></label>
     <input id="last">
    </div>

    <div class="field">
     <label id="phoneLabel"></label>
     <input id="phone" type="tel">
    </div>

    <div class="field">
     <label id="emailLabel"></label>
     <input id="email" type="email">
    </div>

    <div class="field">
     <label id="dateLabel"></label>
     <input id="contactDate" type="date">
    </div>

    <div class="field">
     <label id="timeLabel"></label>
     <input id="contactTime" type="time">
    </div>

   </div>
  </div>

  <div class="nav">
   <button class="btn btn-secondary" data-back="propertyTypeScreen" id="propertyBack"></button>
   <button class="btn btn-primary" id="submitProperty"></button>
  </div>

 </div>

</section>

<!-- ADVERTISING -->

<section id="advertising" class="screen">

 <div class="panel">

  <div class="kicker">NM GROUP</div>

  <h2 class="section-title" id="advertisingTitle"></h2>
  <p class="section-desc" id="advertisingDesc"></p>

  <div class="form-grid">

   <div class="field">
    <label id="adFirstLabel"></label>
    <input id="adFirst">
   </div>

   <div class="field">
    <label id="adLastLabel"></label>
    <input id="adLast">
   </div>

   <div class="field">
    <label id="adCompanyLabel"></label>
    <input id="adCompany">
   </div>

   <div class="field">
    <label id="adBusinessLabel"></label>
    <input id="adBusiness">
   </div>

   <div class="field">
    <label id="adPhoneLabel"></label>
    <input id="adPhone">
   </div>

   <div class="field">
    <label id="adCountryLabel"></label>
    <input id="adCountry">
   </div>

   <div class="field">
    <label id="adCityLabel"></label>
    <input id="adCity">
   </div>

   <div class="field full">
    <label id="adNotesLabel"></label>
    <textarea id="adNotes"></textarea>
   </div>

  </div>

  <div class="section">
   <h3 id="adRulesTitle"></h3>
   <p class="section-desc" id="adRules"></p>
  </div>

  <div class="nav">
   <button class="btn btn-secondary" data-back="welcome" id="adBack"></button>
   <button class="btn btn-primary" id="submitAd"></button>
  </div>

 </div>

</section>

<!-- SELL -->

<section id="sell" class="screen">

 <div class="panel">

function tr(){return T[LANG] || T.tr}

function setText(id,text){
 const el=$(id);
 if(el) el.textContent=text;
}

function show(id){
 document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
 const el=$(id);
 if(!el)return;
 el.classList.add("active");
 window.scrollTo({top:0,behavior:"smooth"});
}

function clickSound(){
 try{
  const C=window.AudioContext||window.webkitAudioContext;
  if(!C)return;
  const ctx=new C();
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.type="sine";
  osc.frequency.value=720;
  gain.gain.setValueAtTime(.025,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.055);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime+.06);
 }catch(e){}
}

document.addEventListener("click",e=>{
 if(e.target.closest("button,.option,.choice,.property-type,.lang-btn")){
  clickSound();
 }
});

 };

/* =========================================================
   FLOORS
========================================================= */

function populateFloors(){

 const floorCount=$("floorCount");
 const floor=$("floor");

 floorCount.innerHTML="";
 floor.innerHTML="";

 const first1=document.createElement("option");
 first1.value="";
 first1.textContent=tr().floorCount;
 floorCount.appendChild(first1);

 const first2=document.createElement("option");
 first2.value="";
 first2.textContent=tr().floor;
 floor.appendChild(first2);

 for(let i=1;i<=30;i++){

  const o=document.createElement("option");
  o.value=i;
  o.textContent=i;
  floorCount.appendChild(o);

 }

 const special=["Kot -3","Kot -2","Kot -1","Giriş"];

 special.forEach(x=>{
  const o=document.createElement("option");
  o.value=x;
  o.textContent=x;
  floor.appendChild(o);
 });

 for(let i=1;i<=30;i++){

  const o=document.createElement("option");
  o.value=i;
  o.textContent=i;
  floor.appendChild(o);

 }

 const plus=document.createElement("option");
 plus.value="+30";
 plus.textContent="+30";
 floor.appendChild(plus);

}

$("floor").addEventListener("change",()=>{

 const val=$("floor").value;

 const numeric=parseInt(val);

 const current=$("floorCount");

 if(!isNaN(numeric)){

  Array.from(current.options).forEach(o=>{
   if(!o.value)return;
   const n=parseInt(o.value);
   o.hidden=!isNaN(n)&&n<numeric;
  });

 }else{

  Array.from(current.options).forEach(o=>o.hidden=false);

 }

});

/* =========================================================
   GENERIC SINGLE OPTIONS
========================================================= */

document.querySelectorAll(".option").forEach(o=>{

 if(
  o.classList.contains("room")||
  o.classList.contains("building")||
  o.classList.contains("facility")
 )return;

 o.addEventListener("click",()=>{

  const group=
   o.dataset.group||
   (o.classList.contains("kitchen")?"kitchen":
   o.classList.contains("tapu")?"tapu":
   o.classList.contains("credit")?"credit":
   o.classList.contains("view")?"view":
   o.classList.contains("transport")?"transport":
   o.classList.contains("sell-type")?"sell-type":
   o.classList.contains("reg-tapu")?"reg-tapu":null);

  if(group){

   document.querySelectorAll(".option").forEach(x=>{

    let same=false;

    if(group==="kitchen")same=x.classList.contains("kitchen");
    else if(group==="tapu")same=x.classList.contains("tapu");
    else if(group==="credit")same=x.classList.contains("credit");
    else if(group==="view")same=x.classList.contains("view");
    else if(group==="transport")same=x.classList.contains("transport");
    else if(group==="sell-type")same=x.classList.contains("sell-type");
    else if(group==="reg-tapu")same=x.classList.contains("reg-tapu");
    else same=x.dataset.group===group;

    if(same)x.classList.remove("selected");

   });

  }

  o.classList.add("selected");

 });

});
