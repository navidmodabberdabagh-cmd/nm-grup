<!DOCTYPE html>
<html lang="tr">
<head>

<title>NM GROUP — Real Estate & Investment</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@600;700;800&display=swap');
:root{--bg:#02040d;--card:rgba(12,18,39,.80);--gold:#d8b56a;--gold2:#ffe091;--white:#f7f8fc;--muted:#a8b1c6;--line:rgba(255,255,255,.12);--green:#54e39a;--blue:#66b7ff;--red:#ff7272;--shadow:0 28px 90px rgba(0,0,0,.48)}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{font-family:Inter,Arial,sans-serif;color:var(--white);background:radial-gradient(circle at 50% 18%,rgba(82,101,255,.18),transparent 34%),radial-gradient(circle at 12% 78%,rgba(0,210,255,.08),transparent 30%),linear-gradient(145deg,#01030a,#050817 55%,#02060d);min-height:100vh;overflow-x:hidden}button,input,textarea,select{font:inherit;color:inherit}button{border:0}#stars{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.4;animation:twinkle 3s infinite alternate}@keyframes twinkle{to{opacity:.08;transform:scale(.5)}}
header{position:fixed;top:0;left:0;right:0;height:76px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;z-index:50;background:linear-gradient(#02040ddd,transparent);backdrop-filter:blur(9px)}.logo{font:800 23px Montserrat;letter-spacing:5px}.logo span{color:var(--gold2)}.head-actions{display:flex;gap:9px;align-items:center}.lang-current,.profile-head{border:1px solid rgba(216,181,106,.45);padding:10px 14px;border-radius:30px;background:rgba(255,255,255,.035);cursor:pointer}.profile-head{display:none;border-color:rgba(84,227,154,.45)}.profile-head.show{display:block}.lang-menu{position:absolute;right:5vw;top:65px;background:#0b1125;border:1px solid var(--line);border-radius:16px;padding:8px;display:none;box-shadow:var(--shadow)}.lang-menu.open{display:grid}.istanbul-info{position:fixed;top:82px;right:5vw;z-index:45;display:flex;gap:8px;align-items:center;padding:7px 12px;border:1px solid rgba(216,181,106,.28);border-radius:18px;background:rgba(3,7,18,.55);backdrop-filter:blur(10px);font:700 10px Montserrat;letter-spacing:1px;color:rgba(255,255,255,.8);box-shadow:0 8px 30px rgba(0,0,0,.25)}.istanbul-info #istanbulTemp{color:#9df2c4}.istanbul-info .dot{color:#d8b56a}@media(max-width:700px){.istanbul-info{top:78px;right:4vw;font-size:8px;padding:6px 9px}}.lang-menu button{background:transparent;padding:10px 14px;text-align:left;border-radius:10px;cursor:pointer}.lang-menu button:hover{background:rgba(255,255,255,.07)}
main{position:relative;z-index:1;max-width:1050px;margin:auto;padding:110px 20px 55px}.screen{display:none;min-height:calc(100vh - 150px);align-items:center;justify-content:center}.screen.active{display:flex;animation:in .35s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.panel{width:100%;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:34px;box-shadow:var(--shadow);backdrop-filter:blur(18px)}.kicker{font-size:11px;letter-spacing:4px;color:var(--gold2);font-weight:800;margin-bottom:10px}.title{font:700 clamp(27px,4vw,42px) Montserrat;margin-bottom:10px}.desc{color:var(--muted);line-height:1.7;margin-bottom:25px}.hero{text-align:center;max-width:800px;margin:auto}.hero .title{font-size:clamp(34px,6vw,62px);letter-spacing:-1px}.choice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:25px}.choice{min-height:95px;padding:20px;text-align:left;border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border-radius:19px;cursor:pointer;transition:.2s;color:#fff}.choice:hover{transform:translateY(-2px);border-color:rgba(216,181,106,.55)}.choice strong{display:block;font-size:16px;margin-bottom:7px}.choice small{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field{min-width:0}.field.full{grid-column:1/-1}label{display:block;font-size:12px;color:var(--muted);margin:0 0 7px 3px}input,textarea,select{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.045);border-radius:13px;padding:13px 14px;outline:0}input:focus,textarea:focus,select:focus{border-color:rgba(101,232,255,.5)}textarea{min-height:115px;resize:vertical}.section{margin-top:25px;padding-top:23px;border-top:1px solid rgba(255,255,255,.08)}.section-title{font:700 16px Montserrat;margin-bottom:7px}.section-note{font-size:12px;color:var(--muted);margin-bottom:12px}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:26px}.btn{padding:13px 20px;border-radius:13px;cursor:pointer;font-weight:700;border:1px solid var(--line);background:rgba(255,255,255,.04)}.btn.primary{background:linear-gradient(135deg,#f2d37d,#b9944d);color:#111;border:0}.btn.danger{border-color:rgba(255,114,114,.35);color:#ff9a9a}.btn:hover{transform:translateY(-1px)}
.options{display:flex;flex-wrap:wrap;gap:9px}.opt{position:relative;min-width:110px;padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.035);cursor:pointer;user-select:none;transition:.18s;color:#fff}.opt:hover{border-color:rgba(101,232,255,.45)}.opt.selected{border-color:rgba(84,227,154,.85);background:rgba(84,227,154,.09)}.check{display:inline-flex;width:18px;height:18px;border:1px solid rgba(255,255,255,.4);border-radius:5px;align-items:center;justify-content:center;margin-right:8px;vertical-align:-4px;background:rgba(0,0,0,.15)}.opt.selected .check{border-color:var(--green);background:var(--green);color:#07140d}.opt.selected .check:after{content:"✓";font-weight:900;font-size:13px}.summary-btn{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;padding:15px 16px;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:15px;cursor:pointer;transition:.18s;color:#fff}.summary-btn:hover{border-color:rgba(101,232,255,.45)}.summary-btn.selected{border-color:rgba(84,227,154,.8);box-shadow:0 0 0 1px rgba(84,227,154,.15) inset}.summary-btn.selected .summary-value{color:#9df2c4}.summary-value{font-size:12px;color:var(--gold2);margin-left:auto;padding-left:10px}.chev{color:var(--muted);font-size:12px}.popover{margin-top:9px;padding:10px;border:1px solid var(--line);border-radius:17px;background:rgba(4,8,20,.97);max-height:300px;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.35)}.popover .opt{display:flex;align-items:center;width:100%;margin-bottom:6px}.popover .opt:last-child{margin-bottom:0}.popover::-webkit-scrollbar{width:7px}.popover::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:10px}.hidden{display:none!important}.checkrow{display:flex;gap:10px;align-items:center;padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.035);cursor:pointer;transition:.18s}.checkrow:hover{border-color:rgba(101,232,255,.4)}.checkrow.on{border-color:rgba(84,227,154,.8);background:rgba(84,227,154,.08)}.checkbox{width:20px;height:20px;border:1px solid rgba(255,255,255,.4);border-radius:6px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}.checkrow.on .checkbox{background:var(--green);border-color:var(--green);color:#07140d}.checkrow.on .checkbox:after{content:"✓";font-weight:900}.feature-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.alert{padding:16px;border:1px solid rgba(216,181,106,.35);background:rgba(216,181,106,.07);border-radius:15px;color:#f4e3b0;line-height:1.75;font-size:13px;margin-bottom:22px}.success{text-align:center}.successmark{width:82px;height:82px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;background:rgba(84,227,154,.12);border:1px solid rgba(84,227,154,.45);font-size:40px;color:var(--green)}footer{position:relative;z-index:1;text-align:center;padding:30px;color:var(--muted);font-size:12px}.footerbrand{font:800 16px Montserrat;letter-spacing:4px;color:var(--gold2)}.mini-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.range{display:grid;grid-template-columns:1fr 1fr;gap:8px}.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.photo-grid img{width:100%;height:110px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}.portfolio{white-space:pre-wrap;background:#050a18;border:1px solid var(--line);border-radius:16px;padding:16px;line-height:1.55;color:#dce6ff;font-size:12px;max-height:330px;overflow:auto}.account-card{display:flex;align-items:center;gap:15px;padding:16px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.035);margin-bottom:18px}.avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;border:1px solid rgba(216,181,106,.45);background:#0a1022;display:flex;align-items:center;justify-content:center;color:var(--gold2);font-weight:800}.order{border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:10px;background:rgba(255,255,255,.025)}.order strong{color:var(--gold2)}.pill{display:inline-flex;border:1px solid rgba(84,227,154,.35);color:#9df2c4;border-radius:30px;padding:5px 9px;font-size:11px}.land-only{display:none}.inline-actions{display:flex;gap:9px;flex-wrap:wrap}.notice{font-size:12px;color:var(--muted);line-height:1.6;margin-top:9px}
.ad-strip{margin-top:18px;padding:13px 16px;border:1px solid rgba(216,181,106,.34);border-radius:16px;background:linear-gradient(110deg,rgba(216,181,106,.10),rgba(255,255,255,.025));display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:0 10px 35px rgba(0,0,0,.20);transition:.2s}.ad-strip:hover{transform:translateY(-1px);border-color:rgba(216,181,106,.65)}.ad-strip span{font:800 10px Montserrat;letter-spacing:2px;color:var(--gold2)}.ad-strip b{font-size:11px;color:#eef1fa;font-weight:600;flex:1}.ad-strip em{font-style:normal;color:var(--gold2);font-size:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#0c1630;border:1px solid rgba(101,232,255,.3);padding:12px 16px;border-radius:13px;opacity:0;pointer-events:none;transition:.25s;z-index:100;color:#fff}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:700px){.panel{padding:22px;border-radius:22px}.grid,.choice-grid,.feature-grid{grid-template-columns:1fr}.mini-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.nav{flex-direction:column}.nav .btn{width:100%}.hero .title{font-size:36px}.photo-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="stars"></div><div class="toast" id="toast"></div>
<header><div class="logo">NM <span>GROUP</span></div><div class="head-actions"><button class="profile-head" id="profileHead" onclick="go('profile')">PROFILE</button><button class="lang-current" id="langCurrent">Türkçe</button><div class="lang-menu" id="langMenu"></div></div></header><div class="istanbul-info" id="istanbulInfo"><span id="istanbulClock">ISTANBUL --:--:--</span><span class="dot">•</span><span id="istanbulTemp">ISTANBUL --°C</span></div>
<main>
<section id="language" class="screen active"><div class="panel hero"><div class="kicker">NM GROUP</div><h1 class="title" data-k="chooseLang"></h1><p class="desc" data-k="chooseLangDesc"></p><div class="choice-grid" id="languageChoices"></div></div></section>
<section id="welcome" class="screen"><div class="panel hero"><div class="kicker">NM GROUP</div><h1 class="title" data-k="welcome"></h1><p class="desc" data-k="welcomeDesc"></p><div class="choice-grid"><button class="choice" onclick="go('register')"><strong data-k="register"></strong><small data-k="registerSmall"></small></button><button class="choice" onclick="go('login')"><strong data-k="login"></strong><small data-k="loginSmall"></small></button><button class="choice" onclick="go('type')"><strong data-k="enter"></strong><small data-k="enterSmall"></small></button><button class="choice" onclick="go('advertising')"><strong data-k="advertise"></strong><small data-k="advertiseSmall"></small></button><button class="choice" onclick="go('seller')"><strong data-k="sell"></strong><small data-k="sellSmall"></small></button></div><div class="ad-strip" onclick="go('advertising')"><span>NM GROUP</span><b data-k="adBanner"></b><em>→</em></div></div></section>
<section id="register" class="screen"><div class="panel"><div class="kicker">NM GROUP</div><h2 class="title" data-k="registerTitle"></h2><p class="desc" data-k="registerDesc"></p><div class="grid"><div class="field"><label data-k="first"></label><input id="regFirst"></div><div class="field"><label data-k="last"></label><input id="regLast"></div><div class="field"><label data-k="phone"></label><input id="regPhone" type="tel"></div><div class="field"><label data-k="email"></label><input id="regEmail" type="email"></div><div class="field"><label data-k="password"></label><input id="regPassword" type="password"></div><div class="field full"><label data-k="currentResidence"></label><input id="regResidence"></div></div><div class="section"><div class="section-title" data-k="tapuQuestion"></div><div class="options"><div class="opt" onclick="single(this,'regtapu')"><span class="check"></span><span data-k="yes"></span></div><div class="opt" onclick="single(this,'regtapu')"><span class="check"></span><span data-k="no"></span></div></div></div><div class="section"><div class="section-title" data-k="profilePhoto"></div><input id="regPhoto" type="file" accept="image/*"></div><div class="nav"><button class="btn secondary" onclick="go('welcome')" data-k="back"></button><button class="btn primary" onclick="registerUser()" data-k="continue"></button></div></div></section>
<section id="login" class="screen"><div class="panel" style="max-width:650px"><div class="kicker">NM GROUP</div><h2 class="title" data-k="loginTitle"></h2><p class="desc" data-k="loginDesc"></p><div class="grid"><div class="field full"><label data-k="email"></label><input id="loginEmail" type="email"></div><div class="field full"><label data-k="password"></label><input id="loginPassword" type="password"></div></div><div class="inline-actions" style="margin-top:16px"><button class="btn" onclick="forgotPassword()" data-k="forgot"></button></div><p class="notice" data-k="previewNote"></p><div class="nav"><button class="btn secondary" onclick="go('welcome')" data-k="back"></button><button class="btn primary" onclick="loginUser()" data-k="login"></button></div></div></section>
<section id="profile" class="screen"><div class="panel"><div class="kicker">NM GROUP</div><h2 class="title" data-k="myProfile"></h2><div id="profileContent"></div><div class="nav"><button class="btn secondary" onclick="go('welcome')" data-k="home"></button><button class="btn danger" onclick="logout()" data-k="logout"></button></div></div></section>
<section id="type" class="screen"><div class="panel"><div class="kicker">NM GROUP</div><h2 class="title" data-k="chooseType"></h2><p class="desc" data-k="chooseTypeDesc"></p><div class="choice-grid"><button class="choice" onclick="startProperty('daire')"><strong data-k="apartment"></strong><small data-k="apartmentDesc"></small></button><button class="choice" onclick="startProperty('villa')"><strong data-k="villa"></strong><small data-k="villaDesc"></small></button><button class="choice" onclick="startProperty('land')"><strong data-k="land"></strong><small data-k="landDesc"></small></button><button class="choice" onclick="startProperty('shop')"><strong data-k="shop"></strong><small data-k="shopDesc"></small></button><button class="choice" onclick="startProperty('factory')"><strong data-k="factory"></strong><small data-k="factoryDesc"></small></button></div><div class="nav"><button class="btn secondary" onclick="go('welcome')" data-k="back"></button></div></div></section>
<section id="property" class="screen"><div class="panel"><div class="kicker">NM GROUP</div><h2 class="title" data-k="property"></h2><p class="desc" data-k="propertyDesc"></p>
<div class="section"><div class="section-title" data-k="location"></div><div class="mini-grid"><div><label data-k="side"></label><div class="options" id="sideOptions"></div></div><div><label data-k="district"></label><div class="summary-btn" id="districtBtn" onclick="togglePop('districtPop')"><span data-k="district"></span><span class="summary-value" id="districtSummary"></span><span class="chev">⌄</span></div><div class="popover hidden" id="districtPop"></div></div><div class="field full"><label data-k="neighborhood"></label><div class="summary-btn" id="neighborhoodBtn" onclick="openNeighborhood()"><span data-k="neighborhood"></span><span class="summary-value" id="neighborhoodSummary"></span><span class="chev">⌄</span></div><div class="popover hidden" id="neighborhoodPop"></div></div></div></div>

<div class="section" id="buildingSection"><div class="section-title" data-k="buildingType"></div><div class="feature-grid"><div class="checkrow" id="normalRow" onclick="toggleNormal()"><span class="checkbox"></span><span id="normalLabel" data-k="normal"></span></div><div class="checkrow" id="siteRow" onclick="toggleSite()"><span class="checkbox"></span><span data-k="siteInside"></span></div></div><div id="siteBlock" class="hidden"><div style="margin-top:10px" class="summary-btn" id="siteBtn" onclick="openSites()"><span data-k="siteName"></span><span class="summary-value" id="siteSummary"></span><span class="chev">⌄</span></div><div class="popover hidden" id="sitePop"></div></div></div>

<div class="section" id="viewSection"><div class="section-title" data-k="view"></div><div class="summary-btn" id="viewBtn" onclick="togglePop('viewPop')"><span data-k="view"></span><span class="summary-value" id="viewSummary"></span><span class="chev">⌄</span></div><div class="popover hidden" id="viewPop"></div></div>
<div class="section" id="housingSection"><div class="section-title" data-k="housingType"></div><div class="summary-btn" id="housingBtn" onclick="togglePop('housingPop')"><span data-k="housingType"></span><span class="summary-value" id="housingSummary"></span><span class="chev">⌄</span></div><div class="popover hidden" id="housingPop"></div></div>
<div class="section" id="transportSection"><div class="section-title" data-k="transport"></div><div class="summary-btn" id="transportBtn" onclick="togglePop('transportPop')"><span data-k="transport"></span><span class="summary-value" id="transportSummary"></span><span class="chev">⌄</span></div><div class="popover hidden" id="transportPop"></div></div>

<div class="section-title" data-k="immigration"></div>
<div class="summary-btn" id="immigrationBtn" onclick="togglePop('immigrationPop')">
<span data-k="immigration"></span><span class="summary-value" id="immigrationSummary"></span><span class="chev">⌄</span>
</div>
<div class="popover hidden" id="immigrationPop"></div>
</div>

 const p=$(popId); if(p){p.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));const hit=[...p.querySelectorAll('.opt')].find(x=>x.__nmValue===val);if(hit)hit.classList.add('selected');}

}
function displayValue(key){let maps={purpose:{res:tr('purposeResidence'),inv:tr('purposeInvestment'),both:tr('purposeBoth')},kitchen:{closed:tr('closedKitchen'),open:tr('openKitchen'),any:tr('doesntMatter')},parking:{closed:tr('closedParking'),open:tr('openParking'),both:tr('bothParking'),any:tr('doesntMatter')},pool:{open:tr('openPool'),closed:tr('closedPool'),both:tr('bothPool')}};return maps[key]?.[state[key]]||''}
function multiPopover(id,arr,key,sum,btn){
 let p=$(id); if(!p)return;
 p.innerHTML='';
 arr.forEach(([v,l])=>{
   const el=document.createElement('div');
   el.className='opt'+(state[key].includes(v)?' selected':'');
   el.__nmValue=v; el.innerHTML='<span class="check"></span><span>'+l+'</span>';
   el.addEventListener('click',function(ev){ev.stopPropagation();toggleMulti(key,v,id,sum,btn);});
   p.appendChild(el);
 });
 $(sum).textContent=state[key].length?state[key].length:'';
 $(btn).classList.toggle('selected',!!state[key].length);
}
function toggleMulti(key,val,popId,sum,btn){
 state[key].includes(val)?state[key]=state[key].filter(v=>v!==val):state[key].push(val);
 const p=$(popId); if(p){const opts=p.querySelectorAll('.opt');const arr=[...opts];const target=arr.find(x=>x.dataset.value===val);}
 if(p){p.querySelectorAll('.opt').forEach((el,i)=>{if(el.__nmValue===val)el.classList.toggle('selected',state[key].includes(val));});}
 $(sum).textContent=state[key].length?state[key].length:'';
 $(btn).classList.toggle('selected',!!state[key].length);
 clickSound('option');
}
